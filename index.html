<script>
(function(){
  /* Persönlicher Code → Google Apps Script prüft ihn und liefert Schlüssel + Begrüßung */
  var API='https://script.google.com/macros/s/AKfycbxwE-34bI0ZZF3QlRsepfhEV3me8SPu9jdBNRdWdwjvdd-ifc4t4LEQawzWDG1cev0wjw/exec';
  var KEY='hp_zugang', blob=JSON.parse(document.getElementById('sealed').textContent);
  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function digits(c){ return String(c||'').replace(/\D/g,''); }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function forget(){ try{ localStorage.removeItem(KEY); localStorage.removeItem('hp_gast'); }catch(e){} }
  async function decrypt(k){
    var key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.i)},key,b64(blob.c)));
  }
  async function check(code){
    var r; try{ r=await (await fetch(API+'?code='+encodeURIComponent(code))).json(); }
    catch(e){ throw new Error('netz'); }
    if(!r||!r.ok) throw new Error('code');
    return r;
  }
  function show(html,acc){
    try{
      localStorage.setItem(KEY,JSON.stringify(acc));
      localStorage.setItem('hp_gast',JSON.stringify({code:acc.code,anrede:acc.anrede,namen:acc.namen,personen:acc.personen}));
    }catch(e){}
    document.open(); document.write(html); document.close();
  }
  async function openWith(code){
    var r=await check(code);
    var acc={code:code,key:r.key,anrede:r.anrede,namen:r.namen,personen:r.personen};
    show(await decrypt(r.key),acc);
  }
  var gate=document.getElementById('gate'), f=document.getElementById('f'), msg=document.getElementById('msg'), btn=f.querySelector('button');
  var loading=document.getElementById('loading');
  function showGate(t){ loading.hidden=true; gate.hidden=false; if(t) msg.textContent=t; }
  if(!window.crypto||!crypto.subtle||!window.fetch){ showGate('Bitte öffnet die Seite in einem aktuellen Browser.'); return; }
  // Persönlicher Link (#z=…): Code übernehmen und sofort aus der Adresszeile entfernen
  var fromLink=null, m=location.hash.match(/(?:^#|&)z=([^&]+)/);
  if(m){ fromLink=digits(decodeURIComponent(m[1])); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  var acc=load();
  if(fromLink && fromLink.length===8 && !(acc && acc.code===fromLink)){
    openWith(fromLink).catch(function(){ showGate(); });
  } else if(acc && acc.key){
    // Schon einmal geöffnet: sofort entschlüsseln, Begrüßung im Hintergrund auffrischen
    decrypt(acc.key).then(function(html){
      check(acc.code).then(function(r){ acc.anrede=r.anrede; acc.namen=r.namen; acc.personen=r.personen; acc.key=r.key;
        try{ localStorage.setItem(KEY,JSON.stringify(acc)); }catch(e){} }).catch(function(e){ if(e.message==='code') forget(); });
      show(html,acc);
    }).catch(function(){ forget(); showGate(); });
  } else { showGate(); }
  f.addEventListener('submit',function(e){
    e.preventDefault(); var c=digits(f.code.value);
    if(c.length!==8){ msg.textContent='Euer persönlicher Code hat 8 Ziffern.'; f.code.focus(); return; }
    btn.disabled=true; msg.textContent='Einen Moment …';
    openWith(c).catch(function(err){
      btn.disabled=false;
      msg.textContent = err.message==='netz' ? 'Die Verbindung hat nicht geklappt. Bitte versucht es gleich noch einmal.'
                                             : 'Dieser Code stimmt leider nicht. Ihr findet ihn auf eurer Einladung.';
      f.code.select();
    });
  });
})();
</script>
