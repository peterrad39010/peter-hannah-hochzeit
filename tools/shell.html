<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannah &amp; Peter</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="Hannah &amp; Peter">
<meta property="og:description" content="28. August 2027 · Graz">
<meta name="theme-color" content="#fbf8f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f1;color:#2b2620;font:300 16px/1.6 "Jost",system-ui,sans-serif;padding:32px 24px}
.gate{width:100%;max-width:420px;text-align:center}
h1{font:300 clamp(56px,14vw,96px)/.9 "Cormorant Garamond",Georgia,serif;letter-spacing:-.02em;margin:0}
h1 span{display:block;font-style:italic;color:#a8843f;font-size:.55em;line-height:1.1;margin:.08em 0}
.date{font:italic 400 21px "Cormorant Garamond",Georgia,serif;color:#86662a;margin:22px 0 40px;padding-top:18px;border-top:1px solid #e4d6ba}
label{display:block;font-size:14px;letter-spacing:.02em;color:#6d6558;margin-bottom:6px}
input{width:100%;padding:10px 0;font:400 24px/1.3 "Cormorant Garamond",Georgia,serif;text-align:center;color:#2b2620;background:transparent;border:0;border-bottom:1px solid #2b2620;border-radius:0}
input:focus{outline:none;border-bottom-color:#a8843f;box-shadow:0 1px 0 #a8843f}
button{margin-top:26px;background:#565c3b;color:#fffdf8;border:0;padding:14px 32px;font:400 15px/1 "Jost",system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
button:hover{background:#3d3329}
button:focus-visible{outline:2px solid #a8843f;outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.6em;margin:18px 0 0;font:italic 400 19px "Cormorant Garamond",Georgia,serif;color:#3d3329}
.hint{font-size:13px;color:#6d6558;margin-top:28px}
</style>
</head>
<body>
<main class="gate" id="gate" hidden>
  <h1>Hannah<span>&amp;</span>Peter</h1>
  <p class="date">28. August 2027 · Graz</p>
  <form id="f" autocomplete="off">
    <label for="code">Zugangscode</label>
    <input id="code" name="code" inputmode="numeric" autocapitalize="none" spellcheck="false" required>
    <button type="submit">Öffnen</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="hint">Den Zugangscode findet ihr auf eurer Einladung.</p>
</main>
<!--SEALED-->
<script>
(function(){
  var KEY='hp_zugang', blob=JSON.parse(document.getElementById('sealed').textContent);
  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function norm(c){ return String(c||'').trim().toLowerCase().replace(/[\s\-–_]+/g,''); }
  function store(c){ try{ localStorage.setItem(KEY,c); }catch(e){} }
  function load(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  async function open(code){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(norm(code)),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.s),iterations:blob.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.i)},key,b64(blob.c));
    return new TextDecoder().decode(plain);
  }
  function show(html){ document.open(); document.write(html); document.close(); }
  var gate=document.getElementById('gate'), f=document.getElementById('f'), msg=document.getElementById('msg'), btn=f.querySelector('button');
  // Code aus dem QR-Link (#z=…) übernehmen und sofort aus der Adresszeile entfernen
  var fromLink=null, m=location.hash.match(/(?:^#|&)z=([^&]+)/);
  if(m){ fromLink=decodeURIComponent(m[1]); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  var tryCode=fromLink||load();
  if(!window.crypto||!crypto.subtle){ gate.hidden=false; msg.textContent='Bitte öffnet die Seite in einem aktuellen Browser.'; return; }
  if(tryCode){
    open(tryCode).then(function(h){ store(tryCode); show(h); }).catch(function(){ forget(); gate.hidden=false; });
  } else { gate.hidden=false; }
  f.addEventListener('submit',function(e){
    e.preventDefault(); var c=f.code.value; if(!c.trim()) return;
    btn.disabled=true; msg.textContent='Einen Moment …';
    open(c).then(function(h){ store(c); show(h); }).catch(function(){
      btn.disabled=false; msg.textContent='Dieser Code stimmt leider nicht. Ihr findet ihn auf eurer Einladung.'; f.code.select();
    });
  });
})();
</script>
<noscript><p style="text-align:center">Bitte aktiviert JavaScript, um die Seite zu öffnen.</p></noscript>
</body>
</html>
