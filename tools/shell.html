<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannah &amp; Peter</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="Hannah &amp; Peter">
<meta property="og:description" content="28. August 2027 · Graz">
<meta name="theme-color" content="#fbf8f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&family=Allison&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f1;color:#2b2620;font:300 16px/1.6 "Jost",system-ui,sans-serif;padding:32px 24px}
.gate{width:100%;max-width:420px;text-align:center}
h1{font:400 clamp(80px,22vw,128px)/.8 "Allison","Snell Roundhand",cursive;color:#7a5c22;margin:0}
h1 span{display:block;color:#a8843f;font-size:.6em;line-height:1;margin:0}
.date{font:400 17px "Cormorant Garamond",Georgia,serif;letter-spacing:.2em;color:#86662a;margin:22px 0 40px;padding-top:18px;border-top:1px solid #e4d6ba}
label{display:block;font-size:14px;letter-spacing:.02em;color:#6d6558;margin-bottom:6px}
input::placeholder{color:#cfc3a8}
input{letter-spacing:.12em;width:100%;padding:10px 0;font:400 24px/1.3 "Cormorant Garamond",Georgia,serif;text-align:center;color:#2b2620;background:transparent;border:0;border-bottom:1px solid #2b2620;border-radius:0}
input:focus{outline:none;border-bottom-color:#a8843f;box-shadow:0 1px 0 #a8843f}
button{margin-top:26px;background:#535c49;color:#fffdf8;border:0;padding:14px 32px;font:400 15px/1 "Jost",system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
button:hover{background:#3d3329}
button:focus-visible{outline:2px solid #a8843f;outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.6em;margin:18px 0 0;font:italic 400 19px "Cormorant Garamond",Georgia,serif;color:#3d3329}
.hint{font-size:13px;color:#6d6558;margin-top:28px}
.loading{text-align:center}
.loading h1{opacity:.9}
.loading p{font:italic 400 19px "Cormorant Garamond",Georgia,serif;color:#86662a;margin-top:22px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.loading p{animation:none}}
</style>
<noscript><style>.loading{display:none}</style></noscript>
</head>
<body>
<div class="loading" id="loading" aria-live="polite">
  <h1>Hannah<span>&amp;</span>Peter</h1>
  <p>Einen Moment, die Seite wird geöffnet …</p>
</div>
<main class="gate" id="gate" hidden>
  <h1>Hannah<span>&amp;</span>Peter</h1>
  <p class="date">28. August 2027 · Graz</p>
  <form id="f" autocomplete="off">
    <label for="code">Euer persönlicher Code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="0000 0000" maxlength="12" spellcheck="false" required>
    <button type="submit">Öffnen</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="hint">Den Code findet ihr auf eurer Einladung.</p>
</main>
<!--SEALED-->
<script>
(function(){
  /* Persönlicher Code → Google Apps Script prüft ihn und liefert Schlüssel + Begrüßung */
  var API='https://script.google.com/macros/s/AKfycbxwE-34bI0ZZF3QlRsepfhEV3me8SPu9jdBNRdWdwjvdd-ifc4t4LEQawzWDG1cev0wjw/exec';
  var KEY='hp_zugang', blob=JSON.parse(document.getElementById('sealed').textContent);
  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function digits(c){ return String(c||'').replace(/\D/g,''); }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function forget(){ try{ localStorage.removeItem(KEY); localStorage.removeItem('hp_gast'); }catch(e){} }
  async function decrypt(k){
    var key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.i)},key,b64(blob.c)));
  }
  async function check(code){
    var r; try{ r=await (await fetch(API+'?code='+encodeURIComponent(code))).json(); }
    catch(e){ throw new Error('netz'); }
    if(!r||!r.ok) throw new Error('code');
    return r;
  }
  function show(html,acc){
    try{
      localStorage.setItem(KEY,JSON.stringify(acc));
      localStorage.setItem('hp_gast',JSON.stringify({code:acc.code,anrede:acc.anrede,namen:acc.namen,personen:acc.personen}));
    }catch(e){}
    document.open(); document.write(html); document.close();
  }
  async function openWith(code){
    var r=await check(code);
    var acc={code:code,key:r.key,anrede:r.anrede,namen:r.namen,personen:r.personen};
    show(await decrypt(r.key),acc);
  }
  var gate=document.getElementById('gate'), f=document.getElementById('f'), msg=document.getElementById('msg'), btn=f.querySelector('button');
  var loading=document.getElementById('loading');
  function showGate(t){ loading.hidden=true; gate.hidden=false; if(t) msg.textContent=t; }
  if(!window.crypto||!crypto.subtle||!window.fetch){ showGate('Bitte öffnet die Seite in einem aktuellen Browser.'); return; }
  // Persönlicher Link (#z=…): Code übernehmen und sofort aus der Adresszeile entfernen
  var fromLink=null, m=location.hash.match(/(?:^#|&)z=([^&]+)/);
  if(m){ fromLink=digits(decodeURIComponent(m[1])); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  var acc=load();
  if(fromLink && fromLink.length===8 && !(acc && acc.code===fromLink)){
    openWith(fromLink).catch(function(){ showGate(); });
  } else if(acc && acc.key){
    // Schon einmal geöffnet: sofort entschlüsseln, Begrüßung im Hintergrund auffrischen
    decrypt(acc.key).then(function(html){
      check(acc.code).then(function(r){ acc.anrede=r.anrede; acc.namen=r.namen; acc.personen=r.personen; acc.key=r.key;
        try{ localStorage.setItem(KEY,JSON.stringify(acc)); }catch(e){} }).catch(function(e){ if(e.message==='code') forget(); });
      show(html,acc);
    }).catch(function(){ forget(); showGate(); });
  } else { showGate(); }
  f.addEventListener('submit',function(e){
    e.preventDefault(); var c=digits(f.code.value);
    if(c.length!==8){ msg.textContent='Euer persönlicher Code hat 8 Ziffern.'; f.code.focus(); return; }
    btn.disabled=true; msg.textContent='Einen Moment …';
    openWith(c).catch(function(err){
      btn.disabled=false;
      msg.textContent = err.message==='netz' ? 'Die Verbindung hat nicht geklappt. Bitte versucht es gleich noch einmal.'
                                             : 'Dieser Code stimmt leider nicht. Ihr findet ihn auf eurer Einladung.';
      f.code.select();
    });
  });
})();
</script>
<noscript><p style="text-align:center">Bitte aktiviert JavaScript, um die Seite zu öffnen.</p></noscript>
</body>
</html>
